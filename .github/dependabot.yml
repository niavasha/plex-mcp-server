version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Conventional prefixes so Release Please sees these commits at all —
    # its default parser ignores "Bump X from A to B" entirely, which would
    # mean dependency and security updates never cut a release.
    # Production deps use "fix" so a security bump ships a patch release;
    # dev deps use "chore", which is changelog-hidden and releases nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    reviewers:
      - "niavasha"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "niavasha"

  # Base images in the Dockerfile (node:22-slim in both build and runtime
  # stages). Without this, a base image with a published CVE would go
  # unnoticed — npm audit only sees package.json, not the image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
    reviewers:
      - "niavasha"
