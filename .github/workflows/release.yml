name: Release

# Every push to main is considered for release. Release Please accumulates
# Conventional Commits into a release PR that bumps package.json and CHANGELOG;
# merging that PR is the act of releasing. That gives one release per batch of
# work rather than one per commit — a published npm version for every docs or
# CI commit is churn nobody wants, and a push of N commits fires only one
# workflow run anyway, so "per commit" is not achievable even in principle.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags and releases
      pull-requests: write   # maintain the release PR
      actions: write         # dispatch publish.yml
    steps:
      # Preferred identity: a private GitHub App installed on this repo only
      # (Contents + Pull requests: read & write). Its token lasts an hour and is
      # minted per run, so nothing expires and nothing is tied to a person.
      # Configure with the repo *variable* RELEASE_APP_CLIENT_ID (variables,
      # unlike secrets, can gate a step) and the secret RELEASE_APP_PRIVATE_KEY.
      # Only the variable gates the step: unset, the step is skipped and the
      # fallbacks below apply. Set, the key must be valid and the App installed,
      # or the job fails — deliberately, since a silent fallback would put
      # releases back behind manual approval without anyone noticing.
      - name: Mint a release token from the GitHub App
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Cap the token here, so widening the App's installation permissions
          # later cannot widen what this workflow holds.
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the release PR, and release on merge
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Prefer the App token, then RELEASE_TOKEN, else fall back to GITHUB_TOKEN.
          #
          # A release PR opened by GITHUB_TOKEN is authored by
          # `github-actions[bot]`, and every workflow run on such a PR is held
          # at `action_required` with 0s duration — created but never started.
          # Branch protection then sees the required checks as missing and
          # reports the PR as BLOCKED, which is indistinguishable from "checks
          # still pending". 1.3.1 sat unreleased for a day that way, and 1.4.0
          # did the same.
          #
          # Verified 2026-07-31 over 100 PR runs: github-actions[bot] had 16
          # runs at action_required, dependabot[bot] had 0 — so this is
          # specific to the GITHUB_TOKEN actor, not a fork or contributor
          # policy. That evidence is GitHub's own Dependabot, so confirm on the
          # first App-authored release PR that its runs start unapproved.
          #
          # RELEASE_TOKEN may be either a fine-grained PAT or a GitHub App
          # installation token; both need contents:write + pull_requests:write.
          # Unset is safe: releases still work, they just need each run
          # approving by hand.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Everything below runs only on the push that merges the release PR.
      #
      # The publish is dispatched into publish.yml rather than done here,
      # because npm's OIDC trusted publishing is bound to a specific workflow
      # *filename*. Publishing from this file fails with
      # `E404 ... you do not have permission` even though the OIDC token is
      # valid and provenance signs fine — which is exactly how 1.3.0 ended up
      # tagged and released on GitHub but absent from npm.
      #
      # workflow_dispatch is used because a release created with GITHUB_TOKEN
      # does not raise a `release` event that starts workflows, but dispatches
      # are explicitly exempt from that rule. A release created with the App
      # token or RELEASE_TOKEN does raise `release: published`, so publish.yml
      # then starts twice. It serialises per tag and skips a version already on
      # npm, so there is no duplicate npm publish, but the second run rebuilds
      # the ghcr.io image and re-pushes its tags.
      - name: Publish the release via publish.yml
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Dispatching publish.yml for $TAG"
          # Dispatch against the TAG, not main. GitHub's OIDC claims describe
          # the ref the workflow was taken from, and those claims become the
          # SLSA provenance. Dispatching from main makes the published package
          # attest `refs/heads/main` at whatever commit main happens to be,
          # even though the job checks out the tag — so the signature names a
          # different source commit than the artifact was built from.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
