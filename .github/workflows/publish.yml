name: Publish to npm

# The only place that publishes to npm.
#
# npm's OIDC trusted publishing is bound to a specific workflow *filename*, not
# just the repository — so publishing from anywhere else fails with a confusing
# `E404 ... you do not have permission` even though the OIDC token is valid and
# provenance signs successfully. Keeping every publish in this one file means
# the trusted publisher config never has to change.
#
# Triggered two ways:
#   - release: published  — a release a human cuts in the UI
#   - workflow_dispatch   — release.yml calls this after Release Please cuts a
#     release. It has to be a dispatch: a release created with GITHUB_TOKEN does
#     not raise a `release` event that starts workflows (GitHub blocks that to
#     prevent recursion), but workflow_dispatch is explicitly exempt.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.3.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Never let two publishes of the same tag race.
#
# The group must reduce to the same string for both triggers. Once release.yml
# runs under RELEASE_TOKEN, the GitHub Release is created by a real identity,
# so it *does* raise `release: published` — and this workflow is then started
# twice for one version: once by that event and once by release.yml's dispatch.
# `github.ref` would key those as `refs/tags/v1.4.0` vs the dispatch input
# `v1.4.0`, i.e. two different groups that never serialise against each other.
# `github.ref_name` drops the `refs/tags/` prefix so all three agree.
#
# The "already on npm" check below is the second line of defence, but on its
# own it is racy: two concurrent runs can both observe "not published" before
# either uploads.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: License check
        run: |
          npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;MPL-2.0'

  publish:
    name: Publish
    needs: [ci, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Republishing an existing version is a hard error on npm, which would
      # turn a harmless re-dispatch into a red build. Skip instead.
      - name: Skip if this version is already on npm
        id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "publishing $name@$version"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public

  # Container image for ghcr.io, built from the same tag and gated on the same
  # CI and audit jobs as the npm package, so the two never disagree.
  #
  # Lives here rather than in its own workflow so it rides the existing
  # release.yml → workflow_dispatch path and this file's per-tag concurrency
  # group. A second run for the same tag rebuilds and repoints the same tags,
  # which is harmless. Manually re-dispatching an *older* tag would move
  # `latest` back to it, so only do that on purpose.
  docker:
    name: Docker image (ghcr.io)
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned to a SHA, unlike the other jobs: this one can write packages,
      # so a re-pointed tag could push an image under this repo's name.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Both triggers run on the tag ref, which type=semver reads by default;
      # `value` passes the tag explicitly so the tags never depend on that.
      # latest=auto adds `latest` for stable versions only, so a prerelease
      # published from the UI cannot take it.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
